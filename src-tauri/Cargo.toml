[package]
name = "relax"
version = "2.1.1"
description = "Relax - Your data is safe! Reliable local backup and folder synchronization for Windows."
authors = ["Prof. Dattaraj S. Vidyasagar", "Prof. Yash D. Vidyasagar"]
homepage = "https://vsa.edu.in/"
repository = "https://github.com/dsvakola/Relax"
edition = "2021"

[lib]
name = "relax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Time"] }

windows = { version = "0.62", default-features = false, features = ["std", "ApplicationModel", "Foundation", "Services_Store", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
